services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    depends_on:
      - express_backend
    environment:
      - VITE_API_URL=http://express_backend:3000

  express_backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - VITE_API_URL=http://express_backend:3000
